name: Spotify skill release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        copy: [primary, rebuild]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.4'
          cache: false
      - run: go test ./...
      - name: Package skill
        run: |
          for os in linux darwin; do
            for arch in amd64 arm64; do release/package.sh "$os" "$arch"; done
          done
          tar -xzf dist/spotify-linux-amd64.tar.gz -C "$RUNNER_TEMP"
          cd /
          "$RUNNER_TEMP/spotify/scripts/spotify" --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.copy }}
          path: dist/*.tar.gz

  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            archive: linux-amd64
          - runner: ubuntu-24.04-arm
            archive: linux-arm64
          - runner: macos-15
            archive: darwin-arm64
          - runner: macos-15-intel
            archive: darwin-amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: primary
      - name: Run installed executable
        env:
          TARGET: ${{ matrix.archive }}
        run: |
          tar -xzf "spotify-$TARGET.tar.gz" -C "$RUNNER_TEMP"
          cd /
          PATH=/nonexistent "$RUNNER_TEMP/spotify/scripts/spotify" --help

  verify:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      - name: Compare independent archives
        run: |
          diff -qr primary rebuild
          cd primary
          sha256sum *.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: primary/*.tar.gz
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --repo "$GITHUB_REPOSITORY" --generate-notes primary/*
